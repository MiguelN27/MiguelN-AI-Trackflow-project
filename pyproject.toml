[project]
name = "trackflow-suppliers"
version = "0.1.0"
description = "TrackFlow supplier directory API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tinydb>=4.8",
    "pydantic[email]>=2.7",
    "libpass[bcrypt]>=1.9",
    "python-jose[cryptography]>=3.3",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "resend>=2.0",
]

[project.scripts]
seed = "services.suppliers.seed:main"
seed-user = "services.users.seed:main"
seed-incidents = "scripts.seed_incidents:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `trackflow_shared` is mapped in from packages/shared so the backend and the
# /scripts tooling import one copy of the incident rules instead of two.
packages = ["services", "scripts", "packages/shared/trackflow_shared"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "httpx>=0.27",
    "pytest>=8.0",
]
