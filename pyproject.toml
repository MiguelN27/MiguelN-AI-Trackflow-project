[project]
name = "trackflow-suppliers"
version = "0.1.0"
description = "TrackFlow supplier directory API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tinydb>=4.8",
    "pydantic[email]>=2.7",
    "libpass[bcrypt]>=1.9",
    "python-jose[cryptography]>=3.3",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "resend>=2.0",
    "sqlmodel>=0.0.47",
    "psycopg2-binary>=2.9.13",
    "supabase>=2.33.0",
    "pandas>=2.3",
    "prefect>=3",
    "celery[redis]>=5.6,<6",
    "scikit-learn>=1.9.1",
    "xgboost>=3.2.0",
    "matplotlib>=3.11.2",
    "qdrant-client>=1.20.0",
    "openai>=3.46.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    # MCP server (mcps/). fastmcp stays below 4: fastmcp 4 needs mcp>=2.3, while
    # every langchain-mcp-adapters release so far needs mcp<2. mcpauth 0.2 is a
    # pre-release, but 0.1.x has no resource-server mode (Protected Resource Metadata).
    "fastmcp>=3.4.11,<4",
    "mcpauth>=0.2.0b1,<0.3",
    "langchain-mcp-adapters>=0.3.2",
    "markitdown[pdf]>=0.1.9",
    "py-readability-metrics>=1.4.5",
    # RFP Part 3: the approval graph's checkpoints live in PostgreSQL next to the
    # tickets. The checkpointer needs psycopg 3 (SQLAlchemy keeps psycopg2); the
    # binary wheel brings libpq, which macOS here does not have.
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary]>=3.3.9",
    # Milestone 10: the live RFP notification stream (Server-Sent Events). It was
    # already installed through mcp; declared because services/rfp imports it, and
    # it closes open streams when uvicorn shuts down or --reload restarts.
    "sse-starlette>=3.7.0",
]

[project.scripts]
seed = "services.suppliers.seed:main"
seed-user = "services.users.seed:main"
seed-incidents = "scripts.seed_incidents:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `trackflow_shared` is mapped in from packages/shared so the backend and the
# /scripts tooling import one copy of the incident rules instead of two.
# `data` holds the Prefect pipelines that `services/reporting` imports.
# `mcps` holds the MCP servers; they reach `services` over HTTP, never by import.
packages = ["services", "scripts", "packages/shared/trackflow_shared", "data", "mcps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_bcrypt_cost: run bcrypt at the production cost instead of the fast test cost",
]

# `uv run pytest --cov` measures the authentication API (AUTH-088): the auth,
# users and profiles domains and the core modules they are built on. Pass
# `--cov=services` to measure the whole backend instead.
[tool.coverage.run]
source = ["services/auth", "services/users", "services/profiles", "services/core"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "httpx>=0.27",
    "pytest-cov>=7.1.0",
    "pytest>=8.0",
    "time-machine>=3.5.1",
]
